<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Examen 1er seguimiento de Graficación</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="styles.css">

</head>

<body>
    <div class="container text-center my-5">

        <!-- Título principal -->

        <h1>
            Examen 1er seguimiento de Graficación
        </h1>


        <!-- Contenedor de la imagen SVG -->

        <div id="image-container" class="my-4">

            <img
                id="image"
                src="imagenes/skull-cartoon.svg"
                alt="Imagen SVG de una calavera"
                class="img-fluid"
                style="width: 300px; height: auto;"
            >

        </div>


        <!-- Botones para modificar las dimensiones -->

        <div
            class="d-flex flex-wrap justify-content-center gap-2 my-4"
            role="group"
            aria-label="Controles de tamaño de imagen"
        >

            <button
                id="xsmallBtn"
                type="button"
                class="btn btn-warning"
            >
                X-Pequeño
            </button>


            <button
                id="smallBtn"
                type="button"
                class="btn btn-primary"
            >
                Pequeño
            </button>


            <button
                id="mediumBtn"
                type="button"
                class="btn btn-secondary"
            >
                Mediano
            </button>


            <button
                id="largeBtn"
                type="button"
                class="btn btn-success"
            >
                Grande
            </button>


            <button
                id="xlargeBtn"
                type="button"
                class="btn btn-danger"
            >
                X-Grande
            </button>

        </div>


        <!-- Datos del estudiante -->

        <div class="mt-5">

            <h2>
                Integrantes del equipo:
            </h2>

            <h4>
                <b>24200096 - Pedro Carlos Montalbo Castro</b>
            </h4>

        </div>

    </div>


    <!-- JavaScript personalizado -->

    <script src="script.js"></script>


    <!-- JavaScript de Bootstrap -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
